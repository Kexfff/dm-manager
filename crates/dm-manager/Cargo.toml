[package]
name = "dm-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dmm-sys = { path = "../dmm-sys" }
env_logger = "0.11"
kdl = { version = "6.7", default-features = false, features = ["v1-fallback"] }
log = "0.4"
relm4 = { version = "0.11", features = ["libadwaita", "gnome_50"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[build-dependencies]
glib-build-tools = "0.22"
